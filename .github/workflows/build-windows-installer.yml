name: Build ORYN Windows V10.4.1 PD1 Installer

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout ORYN source
        uses: actions/checkout@v7

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install ORYN packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-nonrpi.txt
          python -m pip install "pyinstaller>=6.10,<7"

      - name: Build standalone ORYN desktop application
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          if (Test-Path release) { Remove-Item release -Recurse -Force }
          New-Item -ItemType Directory -Path release | Out-Null
          python -m PyInstaller --noconfirm --clean packaging/windows_v10_4_1/ORYN-V10.4.1.spec
          if (!(Test-Path "dist/ORYN/ORYN.exe")) { throw "ORYN.exe was not created" }
          Copy-Item "packaging/windows/ORYN-Diagnostics.bat" "dist/ORYN/ORYN-Diagnostics.bat" -Force

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build customer setup EXE
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "packaging\windows_v10_4_1\ORYN-V10.4.1-PD1.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "release/ORYN-Windows-Setup-V10.4.1-PD1.exe")) { throw "Installer was not created" }

      - name: Generate SHA-256 and build information
        shell: pwsh
        run: |
          $installer = "release/ORYN-Windows-Setup-V10.4.1-PD1.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  ORYN-Windows-Setup-V10.4.1-PD1.exe" | Set-Content "release/ORYN-Windows-Setup-V10.4.1-PD1.exe.sha256"
          @"
          ORYN Windows Setup V10.4.1 PD1
          Pattern Forge: PF-PRO-V10.4.1-20260828-1
          Pattern Designer: PD-WIN-V1-20260831-1 (77 generators)
          Locked motion baseline: UC-DUNE-MOTION-V9-20260827-1
          Python/Node/Git required on customer PC: NO
          Target: Windows 10/11 x64
          SHA256: $hash
          "@ | Set-Content "release/BUILD-INFO.txt"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: ORYN-Windows-V10.4.1-PD1-Installer
          path: |
            release/ORYN-Windows-Setup-V10.4.1-PD1.exe
            release/ORYN-Windows-Setup-V10.4.1-PD1.exe.sha256
            release/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
