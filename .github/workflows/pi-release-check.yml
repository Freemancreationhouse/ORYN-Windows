name: Pi Release Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required Pi files
        run: |
          test -f setup-pi.sh
          test -f install-pi-from-github.sh
          test -f oryn.service
          test -f nginx/oryn.conf
          test -f static/dist/index.html
          test -f main.py

      - name: Shell syntax
        run: |
          bash -n setup-pi.sh
          bash -n install-pi-from-github.sh
          bash -n oryn

      - name: Python syntax
        run: |
          python -m compileall -q main.py modules
